<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f7f8fa"/>
  <text x="60" y="64" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202b35">How Adam combines two moving averages</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="65" y="180" width="200" height="125" rx="10" fill="#fff" stroke="#8397a2" stroke-width="3"/>
    <text x="165" y="225" font-size="22" font-weight="700" fill="#263640">gradient</text><text x="165" y="264" font-size="21" fill="#596772">gₜ = ∇L(θ)</text>
    <path d="M265 240 H345" stroke="#596772" stroke-width="4"/><path d="M345 240 l-15 -10 v20z" fill="#596772"/>
    <rect x="350" y="120" width="290" height="130" rx="10" fill="#e5f1f0" stroke="#287a78" stroke-width="3"/>
    <text x="495" y="165" font-size="23" font-weight="700" fill="#205e5d">first moment mₜ</text><text x="495" y="205" font-size="19" fill="#263640">moving average of g</text><text x="495" y="232" font-size="18" fill="#596772">direction / momentum</text>
    <path d="M640 185 C690 185 690 220 735 220" fill="none" stroke="#287a78" stroke-width="4"/><path d="M735 220 l-15 -10 v20z" fill="#287a78"/>
    <rect x="350" y="300" width="290" height="130" rx="10" fill="#fbeae5" stroke="#d27559" stroke-width="3"/>
    <text x="495" y="345" font-size="23" font-weight="700" fill="#a4523e">second moment vₜ</text><text x="495" y="385" font-size="19" fill="#263640">moving average of g²</text><text x="495" y="412" font-size="18" fill="#596772">per-parameter scale</text>
    <path d="M640 365 C690 365 690 260 735 260" fill="none" stroke="#d27559" stroke-width="4"/><path d="M735 260 l-15 -10 v20z" fill="#d27559"/>
    <rect x="740" y="160" width="200" height="145" rx="10" fill="#fff" stroke="#687c86" stroke-width="3"/>
    <text x="840" y="205" font-size="23" font-weight="700" fill="#263640">bias correction</text><text x="840" y="247" font-size="20" fill="#287a78">m̂ₜ</text><text x="840" y="280" font-size="20" fill="#a4523e">v̂ₜ</text>
    <path d="M940 232 H1000" stroke="#596772" stroke-width="4"/><path d="M1000 232 l-15 -10 v20z" fill="#596772"/>
    <rect x="1005" y="160" width="160" height="145" rx="10" fill="#e8edf1" stroke="#263640" stroke-width="3"/>
    <text x="1085" y="208" font-size="22" font-weight="700" fill="#263640">update θ</text><text x="1085" y="250" font-size="18" fill="#596772">η · m̂ /</text><text x="1085" y="278" font-size="18" fill="#596772">(√v̂ + ε)</text>
  </g>
  <text x="65" y="485" font-family="Arial,sans-serif" font-size="18" fill="#596772">Adam: smooth the direction, normalize by recent scale, correct the zero-initialization bias.</text>
</svg>
